<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUDS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crud">
<div class="head">
    <h2>crud</h2>
    <p>PRODUCT MANAGMENT SYSTEM</p>
</div>

<div class="inputs">
<input id="title" type="text" placeholder="title">
<div class="price">
<input onkeyup=" getTotal()" id="price" type="number" placeholder="price">
<input onkeyup=" getTotal()" id="taxes" type="number" placeholder="taxes">
<input onkeyup=" getTotal()" id="ads" type="number" placeholder="ads">
<input onkeyup=" getTotal()" id="discount" type="number" placeholder="discount">
<small onkeyup=" getTotal()" id="total"></small>
<!-- what is small -->
</div>
<input id="count" type="number" placeholder="count">
<input id="category" type="text" placeholder="category">
<button id="submit">Create</button>
</div>

<div class="outputs">
<div class="searchBlock">
    <input onkeyup="searchData(this.value)" type="text" id="search" placeholder="search">
    <div class="btnSearch">
        <button onclick="getSearchMood(this.id)"  id="searchTitle">Search By Title</button>
        <button onclick="getSearchMood(this.id)" id="searchCategory">Search By category</button>
     
    </div>
</div>

    <button onclick="deleteAll()" class="deleteAll">Delete All</button>

<table>
<tr>
    <th>id</th>
    <th>title</th>
    <th>price</th>
    <th>taxes</th>
    <th>ads</th>
    <th>discount</th>
    <th>Total</th>
    <th>category</th>
    <th>update</th>
    <th>delete</th>
</tr>
<tbody id="tableBody">


</tbody>
</table>


</div>

   

    <script src="script.js"></script>
</body>
</html>
